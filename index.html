<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDS → PNG FS19 - Conversor Real</title>
    <script src="https://cdn.jsdelivr.net/npm/decode-dxt@1.0.1/decode-dxt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap');

        :root { --blue: #00d4ff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1e2b5c 100%);
            color: #fff;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            text-align: center;
            background: linear-gradient(90deg, #00f0ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-area {
            border: 4px dashed var(--blue);
            border-radius: 24px;
            padding: 70px 30px;
            text-align: center;
            background: rgba(15, 30, 60, 0.75);
            backdrop-filter: blur(16px);
            cursor: pointer;
            transition: 0.4s;
        }

        .upload-area:hover {
            border-color: #00ffcc;
            background: rgba(0, 220, 255, 0.15);
        }

        .files-list {
            margin: 30px 0;
            max-height: 520px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }

        button {
            padding: 14px 28px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00b4ff, #0099ff);
            color: white;
        }

        .status { text-align: center; margin: 20px 0; font-size: 1.2rem; min-height: 30px; color: #00ffcc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DDS → PNG FS19</h1>
        <p style="text-align:center; color:#88ccff; margin:10px 0 30px;">Conversor 100% no Navegador • Client-side com decode-dxt</p>

        <div class="upload-area" id="dropZone">
            <h2>Arraste os arquivos .DDS aqui</h2>
            <p>ou</p>
            <input type="file" id="fileInput" multiple accept=".dds" style="display:none;">
            <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
                📁 Selecionar Arquivos DDS
            </button>
        </div>

        <div class="files-list" id="filesList"></div>

        <div style="text-align:center; margin:25px 0;">
            <button onclick="convertAll()" class="btn-primary" id="convertAllBtn">🔄 Converter Todas</button>
            <button onclick="downloadAll()" class="btn-primary" id="downloadAllBtn" disabled style="margin-left:15px;">
                ⬇️ Baixar Todas as PNGs
            </button>
            <button onclick="clearAll()" style="margin-left:15px; background:#555;">Limpar Tudo</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        let filesData = [];

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const filesList = document.getElementById('filesList');
        const statusEl = document.getElementById('status');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        // Drag & Drop
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#00ffcc'; });
        dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '#00d4ff');
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.style.borderColor = '#00d4ff';
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
            fileInput.value = '';
        });

        function handleFiles(fileList) {
            statusEl.textContent = `Carregando ${fileList.length} arquivo(s)...`;
            Array.from(fileList).forEach(file => {
                if (!file.name.toLowerCase().endsWith('.dds')) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const buffer = e.target.result;
                    const previewUrl = URL.createObjectURL(file);

                    filesData.push({
                        name: file.name,
                        buffer: buffer,
                        previewUrl: previewUrl,
                        pngBlob: null
                    });
                    renderFiles();
                    statusEl.textContent = `${filesData.length} arquivo(s) prontos`;
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function renderFiles() {
            filesList.innerHTML = '';
            filesData.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `
                    <div style="width:80px; height:80px; background:#112244; border-radius:10px; margin-right:18px; overflow:hidden;">
                        <img src="${file.previewUrl}" style="width:100%; height:100%; object-fit:cover;">
                    </div>
                    <div style="flex:1;">
                        <strong>${file.name}</strong><br>
                        <small>${(file.buffer.byteLength / 1024 / 1024).toFixed(2)} MB</small>
                    </div>
                    <div>
                        ${file.pngBlob ? 
                            `<button onclick="downloadSingle(${index})" style="padding:10px 22px;">Baixar PNG</button>` : 
                            `<button onclick="convertSingle(${index})" style="padding:10px 22px; background:#00cc77;">Converter</button>`
                        }
                    </div>
                `;
                filesList.appendChild(div);
            });
        }

        async function convertSingle(index) {
            const file = filesData[index];
            statusEl.textContent = `Convertendo ${file.name}... (decode-dxt)`;

            try {
                const result = await convertDDStoPNG(file.buffer);
                file.pngBlob = result;
                renderFiles();
                downloadAllBtn.disabled = false;
                statusEl.textContent = `✅ ${file.name} convertido com sucesso`;
            } catch (err) {
                statusEl.textContent = `❌ Erro ao converter ${file.name}`;
                console.error(err);
            }
        }

        async function convertAll() {
            const btn = document.getElementById('convertAllBtn');
            btn.disabled = true;
            btn.textContent = "Convertendo...";

            for (let i = 0; i < filesData.length; i++) {
                if (!filesData[i].pngBlob) {
                    await convertSingle(i);
                }
            }

            btn.disabled = false;
            btn.textContent = "🔄 Converter Todas";
            statusEl.textContent = "✅ Conversão concluída!";
        }

        function downloadSingle(index) {
            const file = filesData[index];
            if (!file.pngBlob) return;
            const link = document.createElement('a');
            link.href = URL.createObjectURL(file.pngBlob);
            link.download = file.name.replace('.dds', '.png');
            link.click();
        }

        function downloadAll() {
            filesData.forEach((file, i) => {
                if (file.pngBlob) setTimeout(() => downloadSingle(i), i * 100);
            });
        }

        function clearAll() {
            filesData = [];
            filesList.innerHTML = '';
            downloadAllBtn.disabled = true;
            statusEl.textContent = '';
        }

        // ==================== CONVERSÃO REAL DDS → PNG ====================
        async function convertDDStoPNG(arrayBuffer) {
            const dds = new Uint8Array(arrayBuffer);
            
            // Parse DDS header simples
            const magic = String.fromCharCode(...dds.slice(0,4));
            if (magic !== 'DDS ') throw new Error("Não é um arquivo DDS válido");

            const header = new DataView(arrayBuffer, 4, 124);
            const height = header.getUint32(8, true);
            const width = header.getUint32(12, true);
            const pitchOrLinearSize = header.getUint32(16, true);
            const mipMapCount = header.getUint32(28, true);
            const pfFlags = header.getUint32(76, true);
            const fourCC = header.getUint32(80, true);

            let format = 'unknown';
            if (fourCC === 0x31545844) format = 'DXT1';      // "DXT1"
            else if (fourCC === 0x33545844) format = 'DXT3'; // "DXT3"
            else if (fourCC === 0x35545844) format = 'DXT5'; // "DXT5"

            let decoded;
            if (format === 'DXT1' || format === 'DXT5') {
                decoded = decodeDXT(dds, width, height, format);
            } else {
                // Fallback para formatos não comprimidos (RGBA)
                decoded = new Uint8ClampedArray(dds.slice(128));
            }

            // Criar PNG via Canvas
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(width, height);
            imageData.data.set(decoded);
            ctx.putImageData(imageData, 0, 0);

            return new Promise(resolve => {
                canvas.toBlob(blob => resolve(blob), 'image/png', 1.0);
            });
        }

        function decodeDXT(ddsData, width, height, format) {
            // decode-dxt espera os dados comprimidos após o header
            const compressedData = new Uint8Array(ddsData.slice(128));
            let decoded;

            if (format === 'DXT1') {
                decoded = decodeDXT1(compressedData, width, height);
            } else if (format === 'DXT5') {
                decoded = decodeDXT5(compressedData, width, height);
            } else {
                decoded = decodeDXT1(compressedData, width, height); // fallback
            }
            return decoded;
        }

        // Funções auxiliares do decode-dxt (exemplo básico)
        function decodeDXT1(data, width, height) {
            return window.decodeDXT.decodeDXT1(data, width, height);
        }

        function decodeDXT5(data, width, height) {
            return window.decodeDXT.decodeDXT5(data, width, height);
        }

        console.log('%cConversor DDS com decode-dxt carregado!', 'color:#00ffcc; font-size:16px;');
    </script>
</body>
</html>
