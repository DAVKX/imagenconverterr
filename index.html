<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG MODS - Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0a0a0a; color: #ffffff; min-height: 100vh; overflow-x: hidden; }

        .bg-blur {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70vw; height: 70vh;
            background: radial-gradient(circle, rgba(220, 20, 60, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px); z-index: -1;
        }

        .top-bar { display: flex; align-items: center; padding: 20px 30px; }
        .menu-btn { font-size: 2rem; color: #fff; cursor: pointer; background: none; border: none; }
        .menu-btn:hover { color: #ff4b4b; }

        .sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100vh;
            background: rgba(15, 15, 15, 0.98); backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 75, 75, 0.3);
            transition: left 0.4s ease; z-index: 999; padding: 20px; box-shadow: 5px 0 30px rgba(0,0,0,0.6);
        }
        .sidebar.aberto { left: 0; }

        .close-btn {
            position: absolute; top: 20px; right: 20px;
            font-size: 2rem; color: #ff4b4b; background: none; border: none; cursor: pointer;
        }

        .sidebar h3 { color: #ff4b4b; margin: 20px 0 15px; text-align: center; }

        .admin-login-btn, .btn-add {
            width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px;
        }
        .admin-login-btn { background: #ff4b4b; color: white; border: none; }
        .btn-add { background: transparent; border: 1px solid #ff4b4b; color: #fff; }

        #createBtn, #logoutBtn { display: none; }
        .admin-mode #createBtn, .admin-mode #logoutBtn { display: block; }

        header { text-align: center; padding: 10px 20px 20px; }
        h1 {
            font-size: 3.5rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, #ff4b4b, #990000);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .barra-controle {
            display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05); padding: 12px 20px; 
            border-radius: 50px; width: fit-content; margin: 0 auto 50px auto;
        }
        .barra-controle a {
            color: #ccc; text-decoration: none; font-weight: 600; padding: 8px 20px;
            border-radius: 30px; transition: all 0.3s; cursor: pointer;
        }
        .barra-controle a:hover, .barra-controle a.ativo {
            background: rgba(255, 50, 50, 0.2); color: #fff;
        }

        .grid-apps { 
            display: none; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; max-width: 1200px; margin: 0 auto; padding: 0 20px 50px; 
        }
        .grid-apps.ativa { display: grid; }

        .app-card {
            background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 75, 75, 0.15); border-radius: 20px; 
            padding: 25px; text-align: center; transition: all 0.3s;
            position: relative;
        }
        .app-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(220, 20, 60, 0.25); }

        .admin-actions {
            position: absolute; top: 15px; right: 15px; display: none; gap: 8px;
        }
        .admin-mode .admin-actions { display: flex; }

        .edit-btn, .delete-btn {
            width: 35px; height: 35px; border: none; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        }
        .edit-btn { background: #ff9800; }
        .delete-btn { background: #f44336; }

        .app-foto { width: 120px; height: 120px; border-radius: 25%; object-fit: cover; margin-bottom: 20px; }
        
        .btn-link {
            display: inline-block; background: linear-gradient(45deg, #d32f2f, #ff1744);
            color: white; padding: 12px 35px; border-radius: 30px; font-weight: bold;
            text-decoration: none; margin-top: 10px;
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px); z-index: 1001;
            justify-content: center; align-items: center;
        }
        .modal-overlay.ativo { display: flex; }

        .modal {
            background: #111; border: 1px solid #ff4b4b; border-radius: 15px;
            padding: 30px; width: 90%; max-width: 420px;
        }

        .modal input, .modal select {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px;
            border: 1px solid #444; background: #222; color: #fff;
        }
        .modal input:focus { border-color: #ff4b4b; outline: none; }

        .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
        .modal-btns button {
            flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .btn-cancelar { background: #333; color: white; }
        .btn-salvar { background: #ff4b4b; color: white; }

        /* Preview da imagem no modal */
        #imgPreview {
            width: 100%; height: 140px; object-fit: contain; background: #222;
            border: 1px solid #444; border-radius: 8px; margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <div class="top-bar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div class="sidebar" id="sidebar">
        <button class="close-btn" onclick="toggleMenu()">×</button>
        <h3>Painel Admin</h3>
        <button class="admin-login-btn" id="adminLoginBtn" onclick="abrirLogin()">Login Admin</button>
        <button class="btn-add" id="createBtn" onclick="abrirModal()">+ Criar Novo App</button>
        <button class="btn-add" id="logoutBtn" onclick="logoutAdmin()" style="background:#c62828;">Sair do Admin</button>
    </div>

    <header>
        <h1>GG MODS</h1>
        <nav class="barra-controle">
            <a class="ativo" onclick="mudarAba(event, 'inicio')">Início</a>
            <a onclick="mudarAba(event, 'lancamentos')">Lançamentos</a>
            <a onclick="mudarAba(event, 'mais-baixados')">Mais Baixados</a>
            <a onclick="mudarAba(event, 'categorias')">Categorias</a>
        </nav>
    </header>

    <main id="inicio" class="grid-apps ativa"></main>
    <main id="lancamentos" class="grid-apps"></main>
    <main id="mais-baixados" class="grid-apps"></main>
    <main id="categorias" class="grid-apps">
        <div style="text-align: center; color: #aaa; padding: 80px 20px;">
            <h2>Categorias em construção...</h2>
        </div>
    </main>

    <!-- Modal Login -->
    <div class="modal-overlay" id="modalLogin">
        <div class="modal">
            <h2>🔑 Acesso Admin</h2>
            <input type="password" id="senhaAdmin" placeholder="Digite a senha" onkeypress="if(event.key === 'Enter') verificarSenha()">
            <div class="modal-btns">
                <button class="btn-cancelar" onclick="fecharLogin()">Cancelar</button>
                <button class="btn-salvar" onclick="verificarSenha()">Entrar</button>
            </div>
        </div>
    </div>

    <!-- Modal Criar / Editar -->
    <div class="modal-overlay" id="modalCriar">
        <div class="modal">
            <h2 id="modalTitle">Adicionar Mod</h2>
            
            <select id="appAba">
                <option value="inicio">Início</option>
                <option value="lancamentos">Lançamentos</option>
                <option value="mais-baixados">Mais Baixados</option>
            </select>
            
            <input type="text" id="appNome" placeholder="Nome do App">
            <input type="text" id="appImg" placeholder="Link da Imagem (URL)" oninput="previewImagem()">
            <img id="imgPreview" alt="Preview">
            
            <input type="text" id="appDesc" placeholder="Descrição">
            <input type="text" id="appLink" placeholder="Link de Download">
            
            <div class="modal-btns">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="btn-salvar" onclick="salvarApp()">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        let adminMode = false;
        const SENHA_CORRETA = "ggmods123";
        let cardEmEdicao = null;

        function salvarNoBanco() {
            const apps = {};
            ['inicio', 'lancamentos', 'mais-baixados'].forEach(aba => {
                const container = document.getElementById(aba);
                apps[aba] = Array.from(container.querySelectorAll('.app-card')).map(card => ({
                    nome: card.querySelector('h2').textContent.trim(),
                    img: card.querySelector('img').src,
                    desc: card.querySelector('p').textContent.trim(),
                    link: card.querySelector('.btn-link').href
                }));
            });
            localStorage.setItem('ggmods_apps', JSON.stringify(apps));
        }

        function criarCard(app) {
            const card = document.createElement('article');
            card.className = 'app-card';
            card.innerHTML = `
                <div class="admin-actions">
                    <button class="edit-btn" onclick="editarApp(this)">✏️</button>
                    <button class="delete-btn" onclick="deletarApp(this)">🗑️</button>
                </div>
                <img src="\( {app.img}" class="app-foto" alt=" \){app.nome}">
                <h2>${app.nome}</h2>
                <p>${app.desc}</p>
                <a href="${app.link}" class="btn-link" target="_blank">BAIXAR MOD</a>
            `;
            return card;
        }

        function carregarDoBanco() {
            const dados = localStorage.getItem('ggmods_apps');
            if (!dados) return;
            const apps = JSON.parse(dados);

            ['inicio', 'lancamentos', 'mais-baixados'].forEach(abaId => {
                const container = document.getElementById(abaId);
                if (!container || !apps[abaId]) return;
                container.innerHTML = '';

                apps[abaId].forEach(app => {
                    container.appendChild(criarCard(app));
                });
            });
        }

        function previewImagem() {
            const url = document.getElementById('appImg').value.trim();
            const preview = document.getElementById('imgPreview');
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        }

        function salvarApp() {
            const abaAlvo = document.getElementById('appAba').value;
            const nome = document.getElementById('appNome').value.trim();
            let img = document.getElementById('appImg').value.trim();
            const desc = document.getElementById('appDesc').value.trim();
            const link = document.getElementById('appLink').value.trim() || '#';

            if (!nome || !desc) return alert("Nome e Descrição são obrigatórios!");

            // Fallback se imagem estiver vazia
            if (!img) img = 'https://via.placeholder.com/120/1a1a1a/ff4b4b?text=Sem+Foto';

            const novoApp = { nome, img, desc, link };

            if (cardEmEdicao) {
                // EDITAR
                cardEmEdicao.querySelector('img').src = novoApp.img;
                cardEmEdicao.querySelector('h2').textContent = novoApp.nome;
                cardEmEdicao.querySelector('p').textContent = novoApp.desc;
                cardEmEdicao.querySelector('.btn-link').href = novoApp.link;

                // Sincroniza outra aba
                const abaAtual = cardEmEdicao.parentElement.id;
                if (abaAtual === 'inicio' || abaAtual === 'lancamentos') {
                    const outraAba = abaAtual === 'inicio' ? 'lancamentos' : 'inicio';
                    const index = Array.from(document.getElementById(abaAtual).children).indexOf(cardEmEdicao);
                    const cardOutro = document.getElementById(outraAba).children[index];
                    if (cardOutro) {
                        cardOutro.querySelector('img').src = novoApp.img;
                        cardOutro.querySelector('h2').textContent = novoApp.nome;
                        cardOutro.querySelector('p').textContent = novoApp.desc;
                        cardOutro.querySelector('.btn-link').href = novoApp.link;
                    }
                }
                alert("✅ Editado com sucesso!");
            } else {
                // ADICIONAR
                const container = document.getElementById(abaAlvo);
                container.appendChild(criarCard(novoApp));
                if (abaAlvo === 'inicio') {
                    document.getElementById('lancamentos').appendChild(criarCard(novoApp));
                }
                alert("✅ Adicionado com sucesso!");
            }

            salvarNoBanco();
            fecharModal();
        }

        function editarApp(btn) {
            if (!adminMode) return;
            cardEmEdicao = btn.closest('.app-card');

            document.getElementById('modalTitle').textContent = "Editar Mod";
            document.getElementById('appNome').value = cardEmEdicao.querySelector('h2').textContent;
            document.getElementById('appImg').value = cardEmEdicao.querySelector('img').src;
            document.getElementById('appDesc').value = cardEmEdicao.querySelector('p').textContent;
            document.getElementById('appLink').value = cardEmEdicao.querySelector('.btn-link').href;

            previewImagem(); // Mostra preview ao editar
            document.getElementById('modalCriar').classList.add('ativo');
        }

        function deletarApp(btn) {
            if (!adminMode) return;
            if (!confirm("Tem certeza que deseja excluir este mod?")) return;

            const card = btn.closest('.app-card');
            const abaAtual = card.parentElement.id;
            card.remove();

            if (abaAtual === 'inicio' || abaAtual === 'lancamentos') {
                const outraAbaId = abaAtual === 'inicio' ? 'lancamentos' : 'inicio';
                const outraContainer = document.getElementById(outraAbaId);
                const cards = Array.from(outraContainer.querySelectorAll('.app-card'));
                const cardParaRemover = cards.find(c => 
                    c.querySelector('h2').textContent === card.querySelector('h2').textContent
                );
                if (cardParaRemover) cardParaRemover.remove();
            }

            salvarNoBanco();
        }

        // Funções auxiliares
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('aberto'); }
        function abrirLogin() { 
            document.getElementById('modalLogin').classList.add('ativo'); 
            document.getElementById('senhaAdmin').focus();
        }
        function fecharLogin() { 
            document.getElementById('modalLogin').classList.remove('ativo'); 
            document.getElementById('senhaAdmin').value = '';
        }
        function verificarSenha() {
            if (document.getElementById('senhaAdmin').value === SENHA_CORRETA) {
                adminMode = true;
                document.body.classList.add('admin-mode');
                document.getElementById('adminLoginBtn').style.display = 'none';
                fecharLogin();
                alert("✅ Modo Admin ativado!");
            } else alert("❌ Senha incorreta!");
        }
        function logoutAdmin() {
            if (confirm("Sair do Modo Admin?")) {
                adminMode = false;
                document.body.classList.remove('admin-mode');
                document.getElementById('adminLoginBtn').style.display = 'block';
                document.getElementById('sidebar').classList.remove('aberto');
            }
        }
        function mudarAba(event, idAba) {
            document.querySelectorAll('.barra-controle a').forEach(a => a.classList.remove('ativo'));
            event.target.classList.add('ativo');
            document.querySelectorAll('.grid-apps').forEach(el => el.classList.remove('ativa'));
            document.getElementById(idAba).classList.add('ativa');
        }
        function abrirModal() {
            if (!adminMode) return alert("Faça login como Admin primeiro!");
            document.getElementById('modalTitle').textContent = "Adicionar Novo Mod";
            cardEmEdicao = null;
            document.getElementById('appNome').value = '';
            document.getElementById('appImg').value = '';
            document.getElementById('appDesc').value = '';
            document.getElementById('appLink').value = '';
            document.getElementById('imgPreview').style.display = 'none';
            document.getElementById('modalCriar').classList.add('ativo');
        }
        function fecharModal() {
            document.getElementById('modalCriar').classList.remove('ativo');
            cardEmEdicao = null;
        }

        window.onload = carregarDoBanco;
    </script>
</body>
</html>
