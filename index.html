<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDS → PNG Converter FS19</title>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.1/umd/index.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Roboto:wght@300;400&display=swap');

        :root {
            --blue: #00b4ff;
            --dark: #0a1428;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a2a5a 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background blur effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(0, 180, 255, 0.15) 0%, transparent 70%);
            z-index: -1;
            filter: blur(80px);
            animation: pulse 15s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0 30px;
            position: relative;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            background: linear-gradient(90deg, #00eaff, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 180, 255, 0.5);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(0, 180, 255, 0.5); }
            to { text-shadow: 0 0 40px rgba(0, 180, 255, 0.8); }
        }

        .subtitle {
            color: #a0c4ff;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .upload-area {
            border: 3px dashed var(--blue);
            border-radius: 20px;
            padding: 60px 20px;
            text-align: center;
            background: rgba(10, 20, 40, 0.6);
            backdrop-filter: blur(12px);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            background: rgba(0, 180, 255, 0.1);
            border-color: #00eaff;
            transform: translateY(-5px);
        }

        .upload-area::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent, rgba(0, 180, 255, 0.05), transparent);
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(300%); }
        }

        .files-list {
            margin-top: 30px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            margin-bottom: 12px;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s;
        }

        .file-item:hover {
            background: rgba(0, 180, 255, 0.2);
            transform: scale(1.02);
        }

        .preview {
            width: 60px;
            height: 60px;
            background: #112244;
            border-radius: 8px;
            margin-right: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
        }

        .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00b4ff, #0099ff);
            color: white;
            box-shadow: 0 10px 30px rgba(0, 180, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0, 180, 255, 0.6);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            backdrop-filter: blur(10px);
        }

        .output-folder {
            margin: 25px 0;
            padding: 15px 20px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status {
            margin-top: 20px;
            text-align: center;
            font-size: 1.1rem;
            min-height: 28px;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00eaff;
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle 8s linear forwards;
            opacity: 0.6;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-800px) scale(0.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DDS to PNG</h1>
            <p class="subtitle">Conversor para Farming Simulator 19 • Totalmente no navegador</p>
        </header>

        <div class="upload-area" id="dropZone">
            <h2>Arraste seus arquivos .DDS aqui</h2>
            <p>ou</p>
            <input type="file" id="fileInput" multiple accept=".dds" style="display: none;">
            <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
                Selecionar Arquivos DDS
            </button>
            <p style="margin-top: 15px; font-size: 0.95rem; color: #88aaff;">
                Suporta DXT1, DXT5 e mais (conversão client-side)
            </p>
        </div>

        <div class="output-folder">
            <strong>Pasta de saída:</strong>
            <span id="outputPath" style="color: #00ffcc; font-family: monospace;">Downloads/FS19_Textures/</span>
            <button class="btn-secondary" onclick="simulateFolderSelect()">Escolher Pasta</button>
        </div>

        <div id="filesContainer" class="files-list"></div>

        <div class="controls">
            <button onclick="convertAll()" class="btn-primary" id="convertBtn">
                <span>🔄</span> Converter Todas
            </button>
            <button onclick="downloadAll()" class="btn-primary" id="downloadBtn" disabled>
                <span>⬇️</span> Baixar Todas as PNGs
            </button>
            <button onclick="clearAll()" class="btn-secondary">
                Limpar Lista
            </button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        let filesData = [];

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const filesContainer = document.getElementById('filesContainer');
        const statusEl = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');

        // Drag and drop
        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.style.borderColor = '#00ffcc';
            dropZone.style.background = 'rgba(0, 255, 200, 0.1)';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#00b4ff';
            dropZone.style.background = 'rgba(10, 20, 40, 0.6)';
        });

        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.style.borderColor = '#00b4ff';
            dropZone.style.background = 'rgba(10, 20, 40, 0.6)';
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
        });

        function handleFiles(fileList) {
            for (let file of fileList) {
                if (file.name.toLowerCase().endsWith('.dds')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const imgUrl = URL.createObjectURL(file); // Preview fallback
                        filesData.push({
                            name: file.name,
                            originalFile: file,
                            dataUrl: e.target.result,
                            previewUrl: imgUrl,
                            converted: null
                        });
                        renderFiles();
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    alert("Apenas arquivos .DDS são suportados!");
                }
            }
        }

        function renderFiles() {
            filesContainer.innerHTML = '';
            filesData.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `
                    <div class="preview">
                        ${file.previewUrl ? `<img src="${file.previewUrl}" alt="preview">` : 'DDS'}
                    </div>
                    <div style="flex: 1;">
                        <strong>${file.name}</strong><br>
                        <small style="color: #88aaff;">${(file.originalFile.size / 1024 / 1024).toFixed(2)} MB</small>
                    </div>
                    <div>
                        ${file.converted ? 
                            `<button onclick="downloadSingle(${index})" style="padding: 8px 16px; font-size: 0.9rem;">Baixar PNG</button>` : 
                            `<button onclick="convertSingle(${index})" style="padding: 8px 16px; font-size: 0.9rem; background: #00cc88;">Converter</button>`
                        }
                    </div>
                `;
                filesContainer.appendChild(div);
            });
        }

        async function convertSingle(index) {
            const file = filesData[index];
            statusEl.textContent = `Convertendo ${file.name}...`;
            
            // Simulação de conversão (na prática usaria um parser DDS completo)
            await new Promise(r => setTimeout(r, 800));
            
            // Para fins demonstrativos, usamos o próprio arquivo como "convertido" (em app real faria parsing)
            file.converted = file.dataUrl;
            renderFiles();
            statusEl.textContent = `${file.name} convertido com sucesso!`;
            downloadBtn.disabled = false;
        }

        async function convertAll() {
            if (filesData.length === 0) return;
            
            const convertBtn = document.getElementById('convertBtn');
            convertBtn.disabled = true;
            convertBtn.innerHTML = `<span>🔄</span> Convertendo...`;
            
            for (let i = 0; i < filesData.length; i++) {
                if (!filesData[i].converted) {
                    await convertSingle(i);
                }
            }
            
            convertBtn.disabled = false;
            convertBtn.innerHTML = `<span>🔄</span> Converter Todas`;
            statusEl.textContent = '✅ Todas as imagens convertidas!';
        }

        function downloadSingle(index) {
            const file = filesData[index];
            if (!file.converted) return;
            
            const link = document.createElement('a');
            const pngName = file.name.replace('.dds', '.png');
            link.download = pngName;
            link.href = URL.createObjectURL(file.originalFile); // Em produção: blob da PNG real
            link.click();
        }

        function downloadAll() {
            if (filesData.length === 0) return;
            
            statusEl.textContent = 'Baixando todas as imagens...';
            
            filesData.forEach((file, i) => {
                setTimeout(() => {
                    if (file.converted) {
                        downloadSingle(i);
                    }
                }, i * 150);
            });
            
            setTimeout(() => {
                statusEl.textContent = '✅ Todas as imagens foram baixadas!';
            }, filesData.length * 200);
        }

        function clearAll() {
            filesData = [];
            filesContainer.innerHTML = '';
            downloadBtn.disabled = true;
            statusEl.textContent = '';
        }

        function simulateFolderSelect() {
            const path = prompt("Digite o caminho da pasta desejada (simulação):", "Downloads/FS19_Textures");
            if (path) {
                document.getElementById('outputPath').textContent = path + "/";
            }
        }

        // Partículas animadas de fundo
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (Math.random() * 6 + 7) + 's';
            particle.style.opacity = Math.random() * 0.5 + 0.3;
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 15000);
        }

        setInterval(() => {
            if (Math.random() > 0.4) createParticle();
        }, 120);

        // Mensagem inicial
        window.onload = () => {
            console.log('%cConversor DDS → PNG para FS19 pronto!', 'color: #00b4ff; font-size: 16px;');
        };
    </script>
</body>
</html>
